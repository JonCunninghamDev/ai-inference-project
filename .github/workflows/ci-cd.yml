name: Air-Gapped RAG CI/CD Pipeline\n\non:\n  push:\n    branches: [ main, develop ]\n  pull_request:\n    branches: [ main ]\n  workflow_dispatch:\n    inputs:\n      environment:\n        description: 'Environment to deploy'\n        required: true\n        default: 'dev'\n        type: choice\n        options:\n        - dev\n        - staging\n        - prod\n      action:\n        description: 'Action to perform'\n        required: true\n        default: 'deploy'\n        type: choice\n        options:\n        - deploy\n        - update\n        - destroy\n\nenv:\n  AWS_REGION: us-east-1\n  PYTHON_VERSION: '3.12'\n\njobs:\n  # Security and code quality checks\n  security-scan:\n    name: Security & Quality Scan\n    runs-on: ubuntu-latest\n    steps:\n    - name: Checkout code\n      uses: actions/checkout@v4\n\n    - name: Set up Python\n      uses: actions/setup-python@v4\n      with:\n        python-version: ${{ env.PYTHON_VERSION }}\n\n    - name: Install uv\n      uses: astral-sh/setup-uv@v3\n\n    - name: Install dependencies\n      run: |\n        uv sync --extra dev\n\n    - name: Run security scan with bandit\n      run: |\n        uv run bandit -r src/ -f json -o bandit-report.json || true\n        uv run bandit -r src/ -ll\n\n    - name: Run code quality checks\n      run: |\n        uv run black --check src/ tests/\n        uv run isort --check-only src/ tests/\n        uv run flake8 src/ tests/\n\n    - name: Run type checking\n      run: |\n        uv run mypy src/\n\n    - name: Upload security scan results\n      uses: actions/upload-artifact@v4\n      if: always()\n      with:\n        name: security-scan-results\n        path: bandit-report.json\n\n  # Unit and integration tests\n  test:\n    name: Run Tests\n    runs-on: ubuntu-latest\n    needs: security-scan\n    strategy:\n      matrix:\n        test-type: [unit, integration]\n    steps:\n    - name: Checkout code\n      uses: actions/checkout@v4\n\n    - name: Set up Python\n      uses: actions/setup-python@v4\n      with:\n        python-version: ${{ env.PYTHON_VERSION }}\n\n    - name: Install uv\n      uses: astral-sh/setup-uv@v3\n\n    - name: Install dependencies\n      run: |\n        uv sync --extra test\n\n    - name: Run unit tests\n      if: matrix.test-type == 'unit'\n      run: |\n        uv run pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=html\n\n    - name: Run integration tests\n      if: matrix.test-type == 'integration'\n      run: |\n        uv run pytest tests/integration/ -v --cov=src --cov-report=xml --cov-report=html\n\n    - name: Upload coverage reports\n      uses: codecov/codecov-action@v3\n      if: always()\n      with:\n        file: ./coverage.xml\n        flags: ${{ matrix.test-type }}\n        name: codecov-${{ matrix.test-type }}\n\n    - name: Upload test results\n      uses: actions/upload-artifact@v4\n      if: always()\n      with:\n        name: test-results-${{ matrix.test-type }}\n        path: |\n          htmlcov/\n          coverage.xml\n\n  # CDK validation and synthesis\n  cdk-validate:\n    name: CDK Validation\n    runs-on: ubuntu-latest\n    needs: test\n    steps:\n    - name: Checkout code\n      uses: actions/checkout@v4\n\n    - name: Set up Python\n      uses: actions/setup-python@v4\n      with:\n        python-version: ${{ env.PYTHON_VERSION }}\n\n    - name: Set up Node.js\n      uses: actions/setup-node@v4\n      with:\n        node-version: '20'\n\n    - name: Install CDK\n      run: |\n        npm install -g aws-cdk@latest\n\n    - name: Install uv\n      uses: astral-sh/setup-uv@v3\n\n    - name: Install dependencies\n      run: |\n        uv sync\n\n    - name: CDK Synth (Dev)\n      run: |\n        source .venv/bin/activate\n        cdk synth AirGappedRag-Dev\n\n    - name: CDK Synth (Staging)\n      run: |\n        source .venv/bin/activate\n        cdk synth AirGappedRag-Staging\n\n    - name: CDK Synth (Prod)\n      run: |\n        source .venv/bin/activate\n        cdk synth AirGappedRag-Prod\n\n    - name: Upload CDK templates\n      uses: actions/upload-artifact@v4\n      with:\n        name: cdk-templates\n        path: cdk.out/\n\n  # Development deployment\n  deploy-dev:\n    name: Deploy to Development\n    runs-on: ubuntu-latest\n    needs: [security-scan, test, cdk-validate]\n    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')\n    environment:\n      name: development\n      url: https://console.aws.amazon.com/cloudwatch/home?region=us-east-1#dashboards:name=AirGappedRAG-Dev\n    steps:\n    - name: Checkout code\n      uses: actions/checkout@v4\n\n    - name: Configure AWS credentials\n      uses: aws-actions/configure-aws-credentials@v4\n      with:\n        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}\n        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}\n        aws-region: ${{ env.AWS_REGION }}\n\n    - name: Set up Python\n      uses: actions/setup-python@v4\n      with:\n        python-version: ${{ env.PYTHON_VERSION }}\n\n    - name: Set up Node.js\n      uses: actions/setup-node@v4\n      with:\n        node-version: '20'\n\n    - name: Install CDK\n      run: |\n        npm install -g aws-cdk@latest\n\n    - name: Install uv\n      uses: astral-sh/setup-uv@v3\n\n    - name: Install dependencies\n      run: |\n        uv sync\n\n    - name: CDK Bootstrap (if needed)\n      run: |\n        source .venv/bin/activate\n        cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} || true\n\n    - name: Deploy to Dev\n      run: |\n        source .venv/bin/activate\n        cdk deploy AirGappedRag-Dev --require-approval never --outputs-file cdk-outputs-dev.json\n\n    - name: Upload deployment outputs\n      uses: actions/upload-artifact@v4\n      with:\n        name: deployment-outputs-dev\n        path: cdk-outputs-dev.json\n\n    - name: Run post-deployment tests\n      run: |\n        uv run python scripts/health_monitor.py dev --once\n\n  # Staging deployment\n  deploy-staging:\n    name: Deploy to Staging\n    runs-on: ubuntu-latest\n    needs: [security-scan, test, cdk-validate]\n    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')\n    environment:\n      name: staging\n      url: https://console.aws.amazon.com/cloudwatch/home?region=us-east-1#dashboards:name=AirGappedRAG-Staging\n    steps:\n    - name: Checkout code\n      uses: actions/checkout@v4\n\n    - name: Configure AWS credentials\n      uses: aws-actions/configure-aws-credentials@v4\n      with:\n        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}\n        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}\n        aws-region: ${{ env.AWS_REGION }}\n\n    - name: Set up Python\n      uses: actions/setup-python@v4\n      with:\n        python-version: ${{ env.PYTHON_VERSION }}\n\n    - name: Set up Node.js\n      uses: actions/setup-node@v4\n      with:\n        node-version: '20'\n\n    - name: Install CDK\n      run: |\n        npm install -g aws-cdk@latest\n\n    - name: Install uv\n      uses: astral-sh/setup-uv@v3\n\n    - name: Install dependencies\n      run: |\n        uv sync\n\n    - name: Deploy to Staging\n      run: |\n        source .venv/bin/activate\n        cdk deploy AirGappedRag-Staging --require-approval never --outputs-file cdk-outputs-staging.json\n\n    - name: Upload deployment outputs\n      uses: actions/upload-artifact@v4\n      with:\n        name: deployment-outputs-staging\n        path: cdk-outputs-staging.json\n\n    - name: Run smoke tests\n      run: |\n        uv run python scripts/health_monitor.py staging --once\n\n  # Production deployment (manual approval required)\n  deploy-prod:\n    name: Deploy to Production\n    runs-on: ubuntu-latest\n    needs: [deploy-staging]\n    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'\n    environment:\n      name: production\n      url: https://console.aws.amazon.com/cloudwatch/home?region=us-east-1#dashboards:name=AirGappedRAG-Prod\n    steps:\n    - name: Checkout code\n      uses: actions/checkout@v4\n\n    - name: Configure AWS credentials\n      uses: aws-actions/configure-aws-credentials@v4\n      with:\n        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}\n        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}\n        aws-region: ${{ env.AWS_REGION }}\n\n    - name: Set up Python\n      uses: actions/setup-python@v4\n      with:\n        python-version: ${{ env.PYTHON_VERSION }}\n\n    - name: Set up Node.js\n      uses: actions/setup-node@v4\n      with:\n        node-version: '20'\n\n    - name: Install CDK\n      run: |\n        npm install -g aws-cdk@latest\n\n    - name: Install uv\n      uses: astral-sh/setup-uv@v3\n\n    - name: Install dependencies\n      run: |\n        uv sync\n\n    - name: Deploy to Production\n      run: |\n        source .venv/bin/activate\n        action=\"${{ github.event.inputs.action || 'deploy' }}\"\n        if [ \"$action\" = \"destroy\" ]; then\n          cdk destroy AirGappedRag-Prod --force\n        else\n          cdk deploy AirGappedRag-Prod --require-approval never --outputs-file cdk-outputs-prod.json\n        fi\n\n    - name: Upload deployment outputs\n      if: github.event.inputs.action != 'destroy'\n      uses: actions/upload-artifact@v4\n      with:\n        name: deployment-outputs-prod\n        path: cdk-outputs-prod.json\n\n    - name: Run production validation\n      if: github.event.inputs.action != 'destroy'\n      run: |\n        uv run python scripts/health_monitor.py prod --once\n\n  # Notification job\n  notify:\n    name: Send Notifications\n    runs-on: ubuntu-latest\n    needs: [deploy-dev, deploy-staging, deploy-prod]\n    if: always()\n    steps:\n    - name: Notify on success\n      if: needs.deploy-dev.result == 'success' || needs.deploy-staging.result == 'success' || needs.deploy-prod.result == 'success'\n      run: |\n        echo \"✅ Deployment completed successfully\"\n        # Add Slack/Teams notification here\n\n    - name: Notify on failure\n      if: needs.deploy-dev.result == 'failure' || needs.deploy-staging.result == 'failure' || needs.deploy-prod.result == 'failure'\n      run: |\n        echo \"❌ Deployment failed\"\n        # Add Slack/Teams notification here\n        exit 1