name: Platform Consumer CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-ci:
    uses: JonCunninghamDev/engineering-platform/.github/workflows/reusable-consumer-ci.yml@b107c9306161b395cbcaffebb55e47850b999560
    with:
      mode: full
      enable_python: true
      python_version: "3.12"
      install_uv: true
      python_install_command: uv sync --frozen --extra dev --extra test
      python_test_command: >-
        uv run python -m compileall -q src tests/unit &&
        uv run bandit -r src -ll &&
        uv run pytest tests/unit -q --cov=ai_inference --cov-report=term-missing
      python_build_command: ""
      artifact_retention_days: 7
      timeout_minutes: 30
