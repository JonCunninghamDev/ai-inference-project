global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: ai-inference-control-plane
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8080

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8000

  - job_name: dcgm-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9400
